services:
  app1: &app
    build: .
    environment: {REPLICA_ID: app1}
    cpus: 0.5
    mem_limit: 256m
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
  app2:
    <<: *app
    environment: {REPLICA_ID: app2}
    cpus: 1.0
  app3:
    <<: *app
    environment: {REPLICA_ID: app3}
    cpus: 1.5
  haproxy:
    image: haproxy:3.1-alpine
    user: "0:0"
    environment: {POLICY: "${POLICY:-reactive}"}
    volumes:
      - ./haproxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
      - ./haproxy/start.sh:/usr/local/bin/start.sh:ro
      - haproxy_socket:/run/haproxy
    command: [sh, /usr/local/bin/start.sh]
    ports: ["8080:8080", "127.0.0.1:8404:8404"]
    depends_on: [app1, app2, app3]
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [app1, app2, app3, haproxy]
  controller:
    build: .
    command: [python, -m, controller.controller]
    environment:
      POLICY: "${POLICY:-reactive}"
      FORECAST: "${FORECAST:-ewma}"
      CONTROLLER_INTERVAL: "${CONTROLLER_INTERVAL:-2}"
      LATENCY_SLO: "${LATENCY_SLO:-0.5}"
    volumes:
      - haproxy_socket:/run/haproxy
      - ./results:/opt/project/results
    ports: ["127.0.0.1:8081:8081"]
    depends_on: [prometheus, haproxy]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
volumes:
  haproxy_socket:
